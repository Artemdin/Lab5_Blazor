<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab5_Blazor</title>
    <base href="/" />

    <!-- Підключення Bootstrap для загального макету (бокове меню) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Базові стилі додатку -->
    <link rel="stylesheet" href="css/app.css" />

    <!-- Твої ізольовані стилі (Glassmorphism для Home.razor.css) -->
    <link href="Lab5_Blazor.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- Анімація завантаження -->
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/gameHelper.js"></script>
    <!-- Скрипт Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Скрипт для рендеру Вороного (щоб малювались площини і чорні вершини) -->
    <script>
        window.renderVoronoi = async function (canvasId, width, height, streamRef) {
            let canvas = document.getElementById(canvasId);
            if (!canvas) {
                console.error("Канвас не знайдено!");
                return;
            }
            let ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;

            // Читаємо масив байтів (кольори + вершини) з C# і переносимо на екран
            let buffer = await streamRef.arrayBuffer();
            let imgData = new ImageData(new Uint8ClampedArray(buffer), width, height);
            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
